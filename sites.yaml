# Settings for the uptime monitor
settings:
  timeout_seconds: 5          # give up on a site after this many seconds
  max_response_ms: 2000       # slower than this = unhealthy
  check_interval_seconds: 60  # how often to check in --watch mode
  results_file: results.csv   # where every check is saved

# The websites to monitor
sites:
  - name: Google
    url: https://www.google.com
  - name: GitHub
    url: https://www.github.com
  - name: Broken site (always 500)
    url: https://httpbin.org/status/500
  - name: Slow site (3s delay)
    url: https://httpbin.org/delay/3
  - name: Fake site
    url: https://this-site-does-not-exist-12345.com